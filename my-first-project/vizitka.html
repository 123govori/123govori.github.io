<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Podshiboss</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent1: #a855f7;
      --accent2: #ec4899;
      --accent3: #06b6d4;
      --glow1: rgba(168,85,247,.6);
      --glow2: rgba(236,72,153,.4);
      --glass-bg: rgba(255,255,255,.04);
      --glass-border: rgba(255,255,255,.1);
    }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Canvas background ── */
    #bg { position: fixed; inset: 0; z-index: 0; }

    /* ── Noise grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      background-size: 200px;
      opacity: .5;
    }

    /* ── Page layout ── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Card ── */
    .card {
      width: min(480px, 100%);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 48px 40px 44px;
      backdrop-filter: blur(32px) saturate(1.4);
      -webkit-backdrop-filter: blur(32px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 32px 80px rgba(0,0,0,.6),
        0 0 60px var(--glow1),
        0 0 120px var(--glow2);
      animation: fadeUp .8s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Avatar ring ── */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .avatar-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
      animation: spin 8s linear infinite;
      box-shadow: 0 0 28px var(--glow1);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      user-select: none;
    }

    /* ── Name ── */
    .name {
      text-align: center;
      font-size: clamp(26px, 7vw, 38px);
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1.1;
      background: linear-gradient(135deg, #e879f9, #a855f7, #06b6d4, #ec4899);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradShift 4s ease infinite;
      filter: drop-shadow(0 0 18px rgba(168,85,247,.5));
    }

    @keyframes gradShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Divider ── */
    .divider {
      margin: 12px auto 16px;
      width: 48px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 10px var(--glow1);
    }

    /* ── Specialization ── */
    .spec {
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
      color: rgba(255,255,255,.55);
      letter-spacing: .02em;
      margin-bottom: 36px;
    }

    .spec strong {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--accent3);
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* ── Links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.03);
      text-decoration: none;
      color: rgba(255,255,255,.85);
      font-size: 14px;
      font-weight: 500;
      transition: all .25s cubic-bezier(.22,1,.36,1);
      position: relative;
      overflow: hidden;
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      opacity: 0;
      transition: opacity .25s;
    }

    .link-item:hover {
      border-color: rgba(168,85,247,.4);
      transform: translateX(4px);
      box-shadow: 0 4px 24px rgba(168,85,247,.2);
      color: #fff;
    }

    .link-item:hover::before { opacity: .08; }

    .link-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .link-icon.ozon  { background: linear-gradient(135deg, #005bff, #0095ff); box-shadow: 0 0 14px rgba(0,91,255,.4); }

    .link-text {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .link-label {
      font-size: 11px;
      color: rgba(255,255,255,.4);
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .link-value { font-weight: 600; font-size: 14px; }

    .link-arrow {
      margin-left: auto;
      position: relative;
      z-index: 1;
      opacity: .3;
      transition: opacity .2s, transform .2s;
    }

    .link-item:hover .link-arrow {
      opacity: .8;
      transform: translateX(3px);
    }

    /* ── CTA button ── */
    .btn-wrap {
      display: flex;
      justify-content: center;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .02em;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      box-shadow: 0 4px 20px var(--glow1), 0 0 40px var(--glow2);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--accent1), var(--accent3), var(--accent2));
      z-index: -1;
      animation: borderGlow 3s linear infinite;
      background-size: 200%;
    }

    @keyframes borderGlow {
      0%   { background-position: 0%; }
      100% { background-position: 200%; }
    }

    /* Shine sweep */
    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
      transform: skewX(-20deg);
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {
      0%   { left: -100%; }
      40%  { left: 150%; }
      100% { left: 150%; }
    }

    .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 32px var(--glow1), 0 0 60px var(--glow2); }
    .btn:active { transform: scale(.97); }

    /* ── Footer ── */
    .footer {
      margin-top: 36px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.18);
      letter-spacing: .08em;
    }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .card { padding: 36px 24px 36px; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="page">
  <div class="card">

    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-inner">🔩</div>
      </div>
    </div>

    <h1 class="name">Mr. Podshiboss</h1>
    <div class="divider"></div>

    <p class="spec">
      <strong>Специализация</strong>
      Продажа запчастей<br>для маникюрных аппаратов
    </p>

    <div class="links">

      <a class="link-item" href="https://ozon.ru/s/mr-podshiboss" target="_blank" rel="noopener">
        <div class="link-icon ozon">
          <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="8" fill="none"/>
            <path d="M18 5C11 5 5 11 5 18s6 13 13 13 13-6 13-13S25 5 18 5zm0 20c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z" fill="white"/>
            <circle cx="18" cy="18" r="4" fill="white"/>
          </svg>
        </div>
        <div class="link-text">
          <span class="link-label">Магазин</span>
          <span class="link-value">Ozon — mr-podshiboss</span>
        </div>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

    </div>

    <div class="btn-wrap">
      <a class="btn" href="https://ozon.ru/s/mr-podshiboss" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Написать мне
      </a>
    </div>

    <p class="footer">© 2026 · Mr. Podshiboss</p>
  </div>
</div>

<script>
  /* ── Animated particle background ── */
  (function () {
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let W, H, particles = [], raf;

    const COLORS = ['#a855f7', '#ec4899', '#06b6d4', '#8b5cf6'];
    const COUNT  = window.innerWidth < 600 ? 40 : 70;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function rand(a, b) { return a + Math.random() * (b - a); }

    function Particle() {
      this.reset = function () {
        this.x  = rand(0, W);
        this.y  = rand(0, H);
        this.r  = rand(.8, 2.4);
        this.vx = rand(-0.25, 0.25);
        this.vy = rand(-0.4, -0.1);
        this.life = 0;
        this.maxLife = rand(120, 280);
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      };
      this.reset();
      this.life = Math.random() * this.maxLife; // stagger start
    }

    function init() {
      particles = [];
      for (let i = 0; i < COUNT; i++) particles.push(new Particle());
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      /* Radial ambient glow blobs */
      const grd1 = ctx.createRadialGradient(W * .3, H * .4, 0, W * .3, H * .4, W * .45);
      grd1.addColorStop(0, 'rgba(168,85,247,.07)');
      grd1.addColorStop(1, 'rgba(168,85,247,0)');
      ctx.fillStyle = grd1; ctx.fillRect(0, 0, W, H);

      const grd2 = ctx.createRadialGradient(W * .72, H * .6, 0, W * .72, H * .6, W * .4);
      grd2.addColorStop(0, 'rgba(236,72,153,.06)');
      grd2.addColorStop(1, 'rgba(236,72,153,0)');
      ctx.fillStyle = grd2; ctx.fillRect(0, 0, W, H);

      /* Particles */
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life++;

        const progress = p.life / p.maxLife;
        const alpha = progress < .15
          ? progress / .15
          : progress > .8
            ? (1 - progress) / .2
            : 1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha * .7;
        ctx.fill();
        ctx.globalAlpha = 1;

        if (p.life >= p.maxLife) p.reset();
      });

      raf = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    resize(); init(); draw();
  })();
</script>
</body>
</html>
